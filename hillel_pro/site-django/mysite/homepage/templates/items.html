<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список товаров</title>
</head>
<body>
    <h1>Список товаров</h1>
    <ul>
        {% for item in items %}
            <li>{{ item.name }}</li>
        {% empty %}
            <li>Нет данных</li>
        {% endfor %}
    </ul>
</body>
</html>
